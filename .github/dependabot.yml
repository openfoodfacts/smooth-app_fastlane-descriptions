# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot-version-update-file#groups

version: 2
updates:
  # 1. GitHub Actions: Combine ALL action updates into a single PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions-all:
        patterns:
          - "*"

  # 2. NPM: Group non-breaking (minor/patch) updates together
  - package-ecosystem: "npm"
    directory: "/screenshot-wrapping"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-minor-patch:
        update-types:
          - "patch"
          - "minor"

  # 3. Bundler (Android Fastlane): Group non-breaking updates
  - package-ecosystem: "bundler"
    directory: "fastlane/android"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      bundler-minor-patch:
        update-types:
          - "patch"
          - "minor"

  # 4. Bundler (iOS Fastlane): Group non-breaking updates
  - package-ecosystem: "bundler"
    directory: "fastlane/ios/fastlane"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      bundler-minor-patch:
        update-types:
          - "patch"
          - "minor"
